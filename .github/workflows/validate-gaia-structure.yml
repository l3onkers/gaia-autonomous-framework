name: Validate GAIA structure

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-structure:
    name: Validate repository governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docs, agents, and skills
        shell: bash
        run: bash .github/workflows/scripts/validate-structure.sh
