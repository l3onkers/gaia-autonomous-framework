name: Release and Package Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version to release (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write
  packages: write

jobs:
  validate-and-release:
    name: Validate, Release and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@l3onkers'

      - name: Run governance validation
        shell: bash
        run: bash .github/workflows/scripts/validate-structure.sh

      - name: Extract Release Notes from CHANGELOG.md
        id: release_notes
        shell: bash
        run: |
          TAG="${{ github.ref_name || github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          echo "Extracting notes for version: $VERSION"
          python3 .github/workflows/scripts/extract-release-notes.py "$VERSION" > release_notes.txt
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: GAIA Autonomous Framework ${{ github.ref_name || github.event.inputs.tag }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          npm publish --access restricted || echo "Package publication completed or version already exists."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
