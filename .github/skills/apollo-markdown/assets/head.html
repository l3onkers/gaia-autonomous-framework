<style>
@font-face {
  font-family: "Company Sans Condensed";
  src:
    url("https://fonts.example.com/inter-font-condensed.woff2") format("woff2"),
    url("https://fonts.example.com/inter-font-condensed.woff") format("woff");
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: "Company Sans Condensed";
  src:
    url("https://fonts.example.com/inter-font-condensed-bold.woff2") format("woff2"),
    url("https://fonts.example.com/inter-font-condensed-bold.woff") format("woff");
  font-weight: 700;
  font-style: normal;
}
@font-face {
  font-family: "Company Sans";
  src:
    url("https://fonts.example.com/inter-font-regular.woff2") format("woff2"),
    url("https://fonts.example.com/inter-font-regular.woff") format("woff");
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: "Company Sans";
  src:
    url("https://fonts.example.com/inter-font-bold.woff2") format("woff2"),
    url("https://fonts.example.com/inter-font-bold.woff") format("woff");
  font-weight: 700;
  font-style: normal;
}

:root {
  --vt-bg: #ffffff;
  --vt-bg-soft: #f6f4f4;
  --vt-text: #452325;
  --vt-text-soft: #7c6566;
  --vt-text-muted: #917e7f;
  --vt-border: #ece9e9;
  --vt-border-strong: #dad3d3;
  --vt-accent: #dd0d47;
  --vt-table-head-bg: #f6f4f4;
  --vt-table-head-text: #452325;
  --vt-link: #816e2c;
  --vt-selection: #e43d6c;
  --vt-content-width: 980px;
  --vt-radius: 3px;
  --vt-shadow: 0 0 10px rgba(69, 35, 37, 0.08);
}



html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0 auto;
  max-width: var(--vt-content-width);
  padding: 2.25rem 1.5rem 4rem;
  background: var(--vt-bg);
  color: var(--vt-text);
  font-family: "Company Sans", Helvetica, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

::selection {
  color: #fff;
  background: var(--vt-selection);
}

p,
ul,
ol,
blockquote,
pre,
table {
  margin: 0 0 1rem;
}

p,
ul,
ol,
blockquote {
  color: var(--vt-text-soft);
  font-size: 1rem;
  line-height: 1.45;
}

@media (min-width: 992px) {
  p,
  ul,
  ol,
  blockquote {
    font-size: 1.0625rem;
  }
}

a {
  color: var(--vt-link);
  text-decoration: none;
}

a:hover,
a:focus {
  text-decoration: underline;
}

hr {
  height: 1px;
  margin: 1.25rem 0;
  border: 0;
  background: var(--vt-border-strong);
}

@media (min-width: 992px) {
  hr {
    margin: 2rem 0;
  }
}

/* Headings */
h1,
h2,
h5,
h6 {
  font-family: "Company Sans Condensed", Helvetica, Arial, sans-serif;
  text-transform: uppercase;
}

h1,
h2,
h3,
h4,
h5,
h6 {
  margin: 2em 0 1em;
  color: var(--vt-text);
}

h1 {
  margin-top: 0;
  line-height: 1;
  font-weight: 700;
  font-size: 2.5rem;
  letter-spacing: 0.01em;
}

@media (min-width: 768px) {
  h1 { font-size: 3.125rem; }
}
@media (min-width: 992px) {
  h1 { font-size: 3.4375rem; }
}
@media (min-width: 1200px) {
  h1 { font-size: 3.75rem; }
}

h2 {
  line-height: 1;
  font-weight: 700;
  font-size: 1.125rem;
}

@media (min-width: 768px) {
  h2 { font-size: 1.25rem; }
}
@media (min-width: 992px) {
  h2 { font-size: 1.625rem; }
}
@media (min-width: 1200px) {
  h2 { font-size: 1.875rem; }
}

h3,
h4 {
  font-family: "Company Sans", Helvetica, Arial, sans-serif;
  line-height: 1.3;
  font-weight: 700;
}

h3 {
  font-size: 1rem;
}

@media (min-width: 768px) {
  h3 { font-size: 1.125rem; }
}
@media (min-width: 992px) {
  h3 { font-size: 1.25rem; }
}
@media (min-width: 1200px) {
  h3 { font-size: 1.375rem; }
}

h4 {
  font-size: 1rem;
  color: var(--vt-text-muted);
}

h5,
h6 {
  line-height: 1.3;
  font-weight: 400;
  font-size: 0.875rem;
  color: var(--vt-text-muted);
}

@media (min-width: 992px) {
  h5,
  h6 { font-size: 1rem; }
}

/* Lists */
ul,
ol {
  padding-left: 1.25rem;
}

li::marker {
  color: var(--vt-accent);
}

li + li {
  margin-top: 0.3rem;
}

/* Blockquote */
blockquote {
  padding: 0.9rem 1rem;
  background: var(--vt-bg-soft);
  border-left: 4px solid var(--vt-accent);
  color: var(--vt-text-soft);
}

/* Code */
code,
pre,
kbd,
samp {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

p code,
li code,
td code,
th code {
  padding: 0.12rem 0.35rem;
  border: 1px solid var(--vt-border);
  background: var(--vt-bg-soft);
  color: var(--vt-text);
  border-radius: 3px;
  font-size: 0.9em;
}

pre {
  padding: 1rem 1.1rem;
  overflow-x: auto;
  border: 1px solid var(--vt-border);
  background: var(--vt-bg-soft);
  border-radius: 3px;
  box-shadow: var(--vt-shadow);
}

pre code {
  padding: 0;
  border: 0;
  background: transparent;
}

/* Tables */
table {
  width: 100%;
  margin-top: 1rem;
  margin-bottom: 2rem;
  border-collapse: collapse;
  table-layout: fixed;
  background: #fff;
}

thead {
  font-weight: 700;
  color: var(--vt-text);
}

tr {
  border-bottom: 1px solid var(--vt-border);
}

th,
td {
  padding: 12px 8px;
  text-align: left;
  vertical-align: middle;
  color: var(--vt-text-soft);
  font-size: 0.96rem;
}

th {
  color: var(--vt-table-head-text);
  font-weight: 700;
  background: var(--vt-table-head-bg);
  border-bottom: 2px solid var(--vt-accent);
}

tbody tr:hover {
  background: #faf8f8;
}

/* Images */
img,
svg,
video {
  max-width: 100%;
  height: auto;
}

/* TOC */
#TOC {
  margin: 1.5rem 0 2rem;
  padding: 1rem 1.1rem;
  background: var(--vt-bg-soft);
  border: 1px solid var(--vt-border);
}

#TOC ul {
  list-style: none;
  padding-left: 0;
}

#TOC li + li {
  margin-top: 0.4rem;
}

/* Mermaid */
.mermaid {
  margin: 1.5rem 0;
  padding: 1rem;
  background: var(--vt-bg-soft);
  border: 1px solid var(--vt-border);
  overflow-x: auto;
}

/* Mobile tables */
@media (max-width: 900px) {
  table {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
  }
}

.doc-main table {
  display: block;
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
}

.doc-main th,
.doc-main td {
  min-width: 140px;
}

.anchor-alias {
  display: block;
  position: relative;
  top: -0.5rem;
  visibility: hidden;
}

</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const slugifyHeadingText = text => text
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s-]/g, "")
    .trim()
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-");

  const createHeadingAliasAnchors = () => {
    const aliasCounts = new Map();

    document.querySelectorAll("h1[id], h2[id], h3[id], h4[id], h5[id], h6[id]").forEach(heading => {
      const baseAlias = slugifyHeadingText(heading.textContent || "");

      if (!baseAlias) {
        return;
      }

      const aliasIndex = aliasCounts.get(baseAlias) || 0;
      aliasCounts.set(baseAlias, aliasIndex + 1);

      const alias = aliasIndex === 0 ? baseAlias : `${baseAlias}-${aliasIndex}`;

      if (alias === heading.id || document.getElementById(alias)) {
        return;
      }

      const anchorAlias = document.createElement("span");
      anchorAlias.id = alias;
      anchorAlias.className = "anchor-alias";
      heading.before(anchorAlias);
    });
  };

  createHeadingAliasAnchors();

  document.querySelectorAll("pre > code.language-mermaid").forEach(code => {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent.trim();
    code.parentElement.replaceWith(div);
  });

  document.querySelectorAll("pre.mermaid").forEach(pre => {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = pre.textContent.trim();
    pre.replaceWith(div);
  });

  document.querySelectorAll("code.mermaid").forEach(code => {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent.trim();
    code.replaceWith(div);
  });

  mermaid.initialize({ startOnLoad: false });
  await mermaid.run();
});
</script>
